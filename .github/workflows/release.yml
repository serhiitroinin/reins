name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm install --global npm@latest
      - name: Publish with the matching npm dist-tag
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            NPM_DIST_TAG="${PACKAGE_VERSION#*-}"
            NPM_DIST_TAG="${NPM_DIST_TAG%%.*}"
          else
            NPM_DIST_TAG="latest"
          fi
          npm publish --access public --provenance --tag "$NPM_DIST_TAG"
      - run: gh release create "${{ inputs.tag }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
