name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm install --global npm@latest
      - name: Resolve release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag does not match package version" >&2
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            NPM_DIST_TAG="${PACKAGE_VERSION#*-}"
            NPM_DIST_TAG="${NPM_DIST_TAG%%.*}"
            IS_PRERELEASE="true"
          else
            NPM_DIST_TAG="latest"
            IS_PRERELEASE="false"
          fi
          echo "npm-dist-tag=$NPM_DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.npm-dist-tag }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
      - name: Create GitHub prerelease
        if: steps.release.outputs.is-prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --generate-notes --verify-tag --prerelease
      - name: Create GitHub release
        if: steps.release.outputs.is-prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --generate-notes --verify-tag
